name: Собрать APK журнала работ

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo 'Android sdkmanager not found on GitHub runner'
            exit 1
          fi
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Journal-Rabot-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
